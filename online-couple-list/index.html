<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f5ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="小差事" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>我们的小差事</title>
  <style>
    :root {
      --bg: #f8f5ef;
      --surface: #fffdf8;
      --surface-2: #f0f5f2;
      --ink: #211f1b;
      --muted: #716c63;
      --line: #e3ddd2;
      --sage: #647d6f;
      --sage-dark: #465f53;
      --rose: #b87474;
      --amber: #af7d38;
      --blue: #617d97;
      --shadow: 0 14px 38px rgba(42, 36, 28, .09);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(221, 235, 229, .8), transparent 34rem),
        linear-gradient(135deg, #f8f5ef 0%, #fbf8f2 46%, #f1eee6 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea, select { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
    }

    a { color: var(--sage-dark); }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 0 40px;
    }

    .shell {
      display: grid;
      gap: 16px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding: 18px 0 4px;
    }

    .kicker {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: .98;
      letter-spacing: 0;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: var(--radius);
      color: var(--ink);
      background: rgba(255, 253, 248, .82);
      box-shadow: inset 0 0 0 1px var(--line);
      white-space: nowrap;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px #d0c8bb, 0 10px 24px rgba(42, 36, 28, .08);
    }

    .btn.primary {
      color: #fff;
      background: var(--sage);
      box-shadow: none;
    }

    .btn.subtle {
      color: var(--muted);
      background: transparent;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .composer {
      position: sticky;
      top: 16px;
      padding: 14px;
      border: 1px solid rgba(227, 221, 210, .88);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.25;
    }

    form {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    input, textarea, select {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: #fffefa;
      outline: none;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(100, 125, 111, .15);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .composer-footer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      min-height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 253, 248, .68);
      box-shadow: inset 0 0 0 1px rgba(227, 221, 210, .9);
    }

    .chip.active {
      color: #fff;
      background: var(--sage-dark);
      box-shadow: none;
    }

    .stats {
      display: flex;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      align-items: center;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      display: inline-block;
      border-radius: 999px;
      background: var(--amber);
    }

    .sync-dot.ready { background: var(--sage); }
    .sync-dot.error { background: var(--rose); }

    .columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .column {
      min-height: 410px;
      padding: 10px;
      border: 1px solid rgba(227, 221, 210, .72);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .42);
    }

    .column header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 9px;
      padding: 0 2px;
    }

    .column h2 {
      margin: 0;
      font-size: 15px;
    }

    .count {
      min-width: 25px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      color: var(--muted);
      background: #fffaf1;
      font-size: 12px;
    }

    .cards {
      display: grid;
      gap: 9px;
    }

    .card {
      display: grid;
      gap: 9px;
      padding: 12px;
      border: 1px solid rgba(227, 221, 210, .86);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(42, 36, 28, .07);
    }

    .card.done { opacity: .56; }

    .card-top {
      display: flex;
      gap: 9px;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card h3 {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .icon-btn {
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      border-radius: var(--radius);
      color: var(--muted);
      background: #f5f0e8;
      box-shadow: inset 0 0 0 1px rgba(227, 221, 210, .86);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--muted);
      background: #f4efe7;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .pill.owner {
      color: #fff;
      background: var(--sage);
    }

    .pill.due {
      color: #fff;
      background: var(--amber);
    }

    .pill.notify {
      color: #fff;
      background: var(--blue);
    }

    .note {
      margin: 0;
      color: var(--muted);
      line-height: 1.52;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 7px;
      align-items: center;
    }

    .status-select {
      min-height: 35px;
      padding: 7px 9px;
      font-size: 13px;
    }

    .empty {
      min-height: 104px;
      display: grid;
      place-items: center;
      padding: 14px;
      border: 1px dashed #d8d0c2;
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      background: rgba(255, 253, 248, .48);
      font-size: 13px;
    }

    dialog {
      width: min(560px, calc(100% - 26px));
      border: 0;
      border-radius: var(--radius);
      padding: 0;
      color: var(--ink);
      background: transparent;
    }

    dialog::backdrop {
      background: rgba(33, 31, 27, .34);
      backdrop-filter: blur(5px);
    }

    .modal {
      padding: 16px;
      border: 1px solid rgba(227, 221, 210, .9);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .modal textarea {
      min-height: 132px;
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 11px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 20;
      transform: translateX(-50%) translateY(18px);
      max-width: min(420px, calc(100% - 30px));
      padding: 11px 13px;
      border-radius: var(--radius);
      color: #fff;
      background: rgba(33, 31, 27, .92);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      text-align: center;
      line-height: 1.42;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 930px) {
      .hero {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .hero-actions { justify-content: flex-start; }

      .main-grid { grid-template-columns: 1fr; }

      .composer { position: static; }

      .columns { grid-template-columns: 1fr; }

      .column { min-height: 190px; }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 1120px);
        padding-top: calc(12px + env(safe-area-inset-top));
      }

      .hero-actions,
      .composer-footer,
      .row,
      .card-actions,
      .modal-actions {
        grid-template-columns: 1fr;
        display: grid;
      }

      .hero-actions .btn,
      .composer-footer .btn,
      .card-actions .btn,
      .modal-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <section class="hero">
        <div>
          <p class="kicker">给我们俩的生活小清单</p>
          <h1>我们的小差事</h1>
        </div>
        <div class="hero-actions">
          <button class="btn" id="notifyButton" type="button">开启提醒</button>
          <button class="btn" id="shareButton" type="button">分享</button>
          <button class="btn" id="importButton" type="button">导入</button>
        </div>
      </section>

      <section class="main-grid">
        <aside class="composer">
          <h2 class="section-title">记一件事</h2>
          <form id="itemForm">
            <label>
              标题
              <input id="titleInput" required maxlength="60" placeholder="比如：京都买线香" />
            </label>
            <label>
              放在哪
              <select id="categoryInput">
                <option value="together">想一起做</option>
                <option value="buy">想让你买</option>
                <option value="home">家里要处理</option>
                <option value="place">想去的地方</option>
                <option value="care">想被照顾</option>
              </select>
            </label>
            <div class="row">
              <label>
                负责人
                <select id="ownerInput">
                  <option value="我们">我们</option>
                  <option value="我">我</option>
                  <option value="男朋友">男朋友</option>
                </select>
              </label>
              <label>
                提醒文案
                <input id="dueInput" maxlength="30" placeholder="这周 / 去日本时" />
              </label>
            </div>
            <label>
              期待感
              <select id="tempoInput">
                <option value="马上">马上</option>
                <option value="近期">近期</option>
                <option value="计划中">计划中</option>
                <option value="心愿">心愿</option>
              </select>
            </label>
            <div class="row">
              <label>
                日期
                <input id="dateInput" type="date" />
              </label>
              <label>
                时间
                <input id="timeInput" type="time" />
              </label>
            </div>
            <label>
              备注
              <textarea id="noteInput" maxlength="180" placeholder="链接、地址、品牌、为什么想要，都可以写在这里。"></textarea>
            </label>
            <div class="composer-footer">
              <p class="hint">清单会同步到云端；有日期的事项可以加入系统日历。</p>
              <button class="btn primary" type="submit">加入清单</button>
            </div>
          </form>
        </aside>

        <section>
          <div class="toolbar">
            <div class="filters" aria-label="筛选">
              <button class="chip active" type="button" data-filter="all">全部</button>
              <button class="chip" type="button" data-filter="open">未完成</button>
              <button class="chip" type="button" data-filter="done">已完成</button>
              <button class="chip" type="button" data-filter="男朋友">男朋友负责</button>
              <button class="chip" type="button" data-filter="我们">一起</button>
              <button class="chip" type="button" data-filter="马上">马上</button>
              <button class="chip" type="button" data-filter="近期">近期</button>
              <button class="chip" type="button" data-filter="计划中">计划中</button>
              <button class="chip" type="button" data-filter="心愿">心愿</button>
            </div>
            <div class="stats" id="stats"></div>
          </div>
          <div class="columns" id="columns"></div>
        </section>
      </section>
    </div>
  </main>

  <dialog id="shareDialog">
    <section class="modal">
      <h2 class="section-title" id="dialogTitle">分享清单</h2>
      <p class="hint" id="dialogHelp">复制下面的链接发给对方，对方打开后会看到同一份当前清单。</p>
      <textarea id="shareText" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button class="btn" id="closeDialog" type="button">关闭</button>
        <button class="btn primary" id="copyShare" type="button">复制</button>
      </div>
    </section>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    const storageKey = "coupleTinyErrands.v3";
    const legacyStorageKey = "coupleTinyErrands.v1";
    const cloudConfig = {
      url: "https://hkaprwjldivpksgbvcne.supabase.co",
      key: "sb_publishable_pH_vmP8hcFpTRCKsqS9vgA_LpREY3ZO",
      table: "couple_items"
    };

    const categories = [
      { id: "now", title: "现在" },
      { id: "soon", title: "最近" },
      { id: "later", title: "以后" }
    ];

    const starterItems = [
      {
        id: crypto.randomUUID(),
        title: "去京都买线香",
        category: "place",
        owner: "我们",
        due: "今年想安排",
        tempo: "心愿",
        date: "",
        time: "",
        note: "可以提前存几家店，想买干净一点、木质一点的味道。",
        status: "先记着"
      },
      {
        id: crypto.randomUUID(),
        title: "乔治队长的咖啡豆",
        category: "buy",
        owner: "男朋友",
        due: "最近",
        tempo: "近期",
        date: "",
        time: "",
        note: "如果路过或者下单方便，就买一包最近适合手冲的。",
        status: "已安排"
      },
      {
        id: crypto.randomUUID(),
        title: "换制冰机",
        category: "home",
        owner: "男朋友",
        due: "最近找时间",
        tempo: "近期",
        date: "",
        time: "",
        note: "看看容量、清洗难度和噪音，不要太占台面。",
        status: "先记着"
      },
      {
        id: crypto.randomUUID(),
        title: "今晚要一起骑车",
        category: "together",
        owner: "我们",
        due: "今晚",
        tempo: "马上",
        date: "",
        time: "",
        note: "不用骑很远，主要是一起出去吹吹风。",
        status: "先记着"
      },
      {
        id: crypto.randomUUID(),
        title: "这周日一起吃小龙虾",
        category: "together",
        owner: "我们",
        due: "这个周末",
        tempo: "近期",
        date: "",
        time: "",
        note: "想找一家味道重一点、不要太吵的。",
        status: "先记着"
      },
      {
        id: crypto.randomUUID(),
        title: "8月骑行青海湖",
        category: "together",
        owner: "我们",
        due: "夏天",
        tempo: "计划中",
        date: "",
        time: "",
        note: "先记着路线、装备和大概假期。",
        status: "先记着"
      }
    ];

    let importedFromHash = false;
    let items = loadItems();
    let activeFilter = "all";
    let cloudReady = false;
    let cloudBusy = false;
    let lastCloudError = "";

    const columnsEl = document.querySelector("#columns");
    const statsEl = document.querySelector("#stats");
    const form = document.querySelector("#itemForm");
    const shareDialog = document.querySelector("#shareDialog");
    const shareText = document.querySelector("#shareText");
    const dialogTitle = document.querySelector("#dialogTitle");
    const dialogHelp = document.querySelector("#dialogHelp");
    const copyShare = document.querySelector("#copyShare");
    const toast = document.querySelector("#toast");
    const notifyButton = document.querySelector("#notifyButton");

    function normalizeItem(item) {
      return {
        id: item.id || crypto.randomUUID(),
        title: item.title || "",
        category: item.category || "together",
        owner: item.owner || "我们",
        due: item.due || "",
        tempo: item.tempo || migrateTempo(item.horizon || item.due),
        date: item.date || "",
        time: item.time || "",
        note: item.note || "",
        status: normalizeStatus(item.status)
      };
    }

    function normalizeStatus(status) {
      if (!status || status === "想想") return "先记着";
      if (status === "已买/已做") return "已完成";
      return status;
    }

    function migrateTempo(value) {
      if (["马上", "近期", "计划中", "心愿"].includes(value)) return value;
      if (["今晚", "今天", "明天"].includes(value)) return "马上";
      if (["这周", "本月", "最近", "周末"].includes(value)) return "近期";
      if (["8月", "夏天", "秋天", "冬天", "春天"].includes(value)) return "计划中";
      return "心愿";
    }

    function loadItems() {
      const hashData = new URLSearchParams(location.hash.slice(1)).get("list");
      if (hashData) {
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(hashData))));
          if (Array.isArray(decoded)) {
            const normalized = decoded.map(normalizeItem);
            localStorage.setItem(storageKey, JSON.stringify(normalized));
            history.replaceState(null, "", location.pathname);
            importedFromHash = true;
            return normalized;
          }
        } catch (error) {
          console.warn(error);
        }
      }

      const saved = localStorage.getItem(storageKey) || localStorage.getItem(legacyStorageKey);
      if (!saved) return starterItems;

      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed.map(normalizeItem) : starterItems;
      } catch (error) {
        return starterItems;
      }
    }

    function saveItems() {
      localStorage.setItem(storageKey, JSON.stringify(items));
    }

    async function cloudRequest(path = "", options = {}) {
      const response = await fetch(`${cloudConfig.url}/rest/v1/${cloudConfig.table}${path}`, {
        ...options,
        headers: {
          apikey: cloudConfig.key,
          Authorization: `Bearer ${cloudConfig.key}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
          ...(options.headers || {})
        }
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `Cloud request failed: ${response.status}`);
      }

      if (response.status === 204) return null;
      return response.json();
    }

    function toCloudItem(item) {
      const normalized = normalizeItem(item);
      return {
        id: normalized.id,
        title: normalized.title,
        category: normalized.category,
        owner: normalized.owner,
        due: normalized.due,
        tempo: normalized.tempo,
        date: normalized.date,
        time: normalized.time,
        note: normalized.note,
        status: normalized.status
      };
    }

    async function syncFromCloud({ seedIfEmpty = false } = {}) {
      if (cloudBusy) return;
      cloudBusy = true;
      try {
        const rows = await cloudRequest("?select=*&order=created_at.desc");
        cloudReady = true;
        lastCloudError = "";

        if (Array.isArray(rows) && rows.length) {
          items = rows.map(normalizeItem);
          saveItems();
          render();
          return;
        }

        if (seedIfEmpty && items.length) {
          await cloudRequest("", {
            method: "POST",
            body: JSON.stringify(items.map(toCloudItem))
          });
          await syncFromCloud();
          return;
        }

        render();
      } catch (error) {
        cloudReady = false;
        lastCloudError = error.message || "云同步暂时不可用";
        render();
      } finally {
        cloudBusy = false;
      }
    }

    async function createCloudItem(item) {
      const rows = await cloudRequest("", {
        method: "POST",
        body: JSON.stringify(toCloudItem(item))
      });
      return Array.isArray(rows) && rows[0] ? normalizeItem(rows[0]) : item;
    }

    async function updateCloudItem(item) {
      await cloudRequest(`?id=eq.${encodeURIComponent(item.id)}`, {
        method: "PATCH",
        body: JSON.stringify(toCloudItem(item))
      });
    }

    async function deleteCloudItem(id) {
      await cloudRequest(`?id=eq.${encodeURIComponent(id)}`, {
        method: "DELETE"
      });
    }

    function filteredItems(categoryId) {
      return items.filter((item) => {
        if (bucketFor(item) !== categoryId) return false;
        if (activeFilter === "all") return true;
        if (activeFilter === "open") return item.status !== "已完成";
        if (activeFilter === "done") return item.status === "已完成";
        return item.owner === activeFilter || item.tempo === activeFilter;
      });
    }

    function bucketFor(item) {
      if (item.tempo === "马上") return "now";
      if (item.tempo === "近期") return "soon";
      return "later";
    }

    function render() {
      const cloudLabel = cloudReady ? "云端已同步" : lastCloudError ? "等待云端表" : "正在同步";
      const dotClass = cloudReady ? "ready" : lastCloudError ? "error" : "";
      statsEl.innerHTML = `<span class="sync-dot ${dotClass}"></span><span>${cloudLabel}</span><span>${items.filter((item) => item.status !== "已完成").length} 件未完成</span>`;
      columnsEl.innerHTML = categories.map((category) => {
        const list = filteredItems(category.id);
        const cards = list.map(renderCard).join("");
        return `
          <article class="column">
            <header>
              <h2>${category.title}</h2>
              <span class="count">${list.length}</span>
            </header>
            <div class="cards">
              ${cards || `<div class="empty">这里还空着。<br>等一个新的念头落下来。</div>`}
            </div>
          </article>
        `;
      }).join("");
    }

    function renderCard(item) {
      const doneClass = item.status === "已完成" ? " done" : "";
      const dateLabel = formatDateTime(item.date, item.time);
      return `
        <article class="card${doneClass}" data-id="${item.id}">
          <div class="card-top">
            <h3>${escapeHtml(item.title)}</h3>
            <button class="icon-btn" type="button" data-action="delete" title="删除">×</button>
          </div>
          <div class="meta">
            <span class="pill owner">${escapeHtml(item.owner)}</span>
            ${item.tempo ? `<span class="pill">${escapeHtml(item.tempo)}</span>` : ""}
            <span class="pill">${escapeHtml(categoryLabel(item.category))}</span>
            ${item.due ? `<span class="pill due">${escapeHtml(item.due)}</span>` : ""}
            ${dateLabel ? `<span class="pill notify">${escapeHtml(dateLabel)}</span>` : ""}
            <span class="pill">${escapeHtml(item.status)}</span>
          </div>
          ${item.note ? `<p class="note">${linkify(escapeHtml(item.note))}</p>` : ""}
          <div class="card-actions">
            <select class="status-select" data-action="status" aria-label="状态">
              ${["先记着", "想安排", "已安排", "先搁置", "已完成"].map((status) => `
                <option value="${status}" ${item.status === status ? "selected" : ""}>${status}</option>
              `).join("")}
            </select>
            ${item.date ? `<button class="btn" type="button" data-action="calendar">日历</button>` : ""}
            <button class="btn" type="button" data-action="done">${item.status === "已完成" ? "取消" : "完成"}</button>
          </div>
        </article>
      `;
    }

    function categoryLabel(category) {
      const labels = {
        together: "一起做",
        buy: "想让你买",
        home: "家里",
        place: "想去",
        care: "照顾我"
      };
      return labels[category] || category;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function linkify(value) {
      return value.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function formatDateTime(date, time) {
      if (!date) return "";
      const parts = date.split("-");
      if (parts.length !== 3) return date;
      const label = `${Number(parts[1])}月${Number(parts[2])}日`;
      return time ? `${label} ${time}` : label;
    }

    function notifyNewItem(item) {
      const body = `${item.title}${item.due ? " · " + item.due : ""}`;
      showToast(`小噜妹新增一条需求！${item.title}`);
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      new Notification("小噜妹新增一条需求！", {
        body,
        tag: `item-${item.id}`,
        icon: "./icon.svg"
      });
    }

    async function requestNotificationPermission() {
      if (!("Notification" in window)) {
        showToast("这个浏览器暂时不支持网页通知");
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        showToast("提醒已开启");
        notifyButton.textContent = "提醒已开启";
      } else {
        showToast("提醒没有开启，可以稍后再试");
      }
    }

    function exportText() {
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(items))));
      return `${location.origin}${location.pathname}#list=${encoded}`;
    }

    function toCalendarStamp(date, time) {
      const safeTime = time || "09:00";
      return `${date.replaceAll("-", "")}T${safeTime.replace(":", "")}00`;
    }

    function downloadCalendar(item) {
      const start = toCalendarStamp(item.date, item.time);
      const endHour = String(Math.min(Number((item.time || "09:00").slice(0, 2)) + 1, 23)).padStart(2, "0");
      const end = toCalendarStamp(item.date, item.time ? `${endHour}:${item.time.slice(3, 5)}` : "10:00");
      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Couple List//Tiny Errands//CN",
        "BEGIN:VEVENT",
        `UID:${item.id}@couple-list`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z`,
        `DTSTART:${start}`,
        `DTEND:${end}`,
        `SUMMARY:${icsEscape(item.title)}`,
        `DESCRIPTION:${icsEscape([item.owner, item.due, item.note].filter(Boolean).join(" · "))}`,
        "BEGIN:VALARM",
        "TRIGGER:-PT30M",
        "ACTION:DISPLAY",
        `DESCRIPTION:${icsEscape("小噜妹的提醒：" + item.title)}`,
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");
      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${item.title.replace(/[\\/:*?"<>|]/g, "").slice(0, 24) || "reminder"}.ics`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("已生成日历提醒文件");
    }

    function icsEscape(value) {
      return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll(",", "\\,")
        .replaceAll(";", "\\;")
        .replaceAll("\n", "\\n");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const newItem = {
        id: crypto.randomUUID(),
        title: document.querySelector("#titleInput").value.trim(),
        category: document.querySelector("#categoryInput").value,
        owner: document.querySelector("#ownerInput").value,
        due: document.querySelector("#dueInput").value.trim(),
        tempo: document.querySelector("#tempoInput").value,
        date: document.querySelector("#dateInput").value,
        time: document.querySelector("#timeInput").value,
        note: document.querySelector("#noteInput").value.trim(),
        status: "先记着"
      };

      if (!newItem.title) return;
      items.unshift(newItem);
      saveItems();
      form.reset();
      render();
      notifyNewItem(newItem);
      try {
        const cloudItem = await createCloudItem(newItem);
        items = items.map((item) => item.id === newItem.id ? cloudItem : item);
        saveItems();
        cloudReady = true;
        lastCloudError = "";
        render();
      } catch (error) {
        cloudReady = false;
        lastCloudError = error.message || "新增后云同步失败";
        render();
      }
    });

    columnsEl.addEventListener("click", async (event) => {
      const action = event.target.dataset.action;
      if (!action) return;
      const card = event.target.closest(".card");
      const item = items.find((entry) => entry.id === card.dataset.id);
      if (!item) return;

      if (action === "delete") {
        items = items.filter((entry) => entry.id !== item.id);
        showToast("已删除");
        saveItems();
        render();
        try {
          await deleteCloudItem(item.id);
          cloudReady = true;
          lastCloudError = "";
        } catch (error) {
          cloudReady = false;
          lastCloudError = error.message || "删除后云同步失败";
        }
        render();
        return;
      }

      if (action === "done") {
        item.status = item.status === "已完成" ? "先记着" : "已完成";
        showToast(item.status === "已完成" ? "完成了" : "已改回未完成");
      }

      if (action === "calendar") {
        downloadCalendar(item);
      }

      saveItems();
      render();
      if (action === "done") {
        try {
          await updateCloudItem(item);
          cloudReady = true;
          lastCloudError = "";
        } catch (error) {
          cloudReady = false;
          lastCloudError = error.message || "状态云同步失败";
        }
        render();
      }
    });

    columnsEl.addEventListener("change", async (event) => {
      if (event.target.dataset.action !== "status") return;
      const card = event.target.closest(".card");
      const item = items.find((entry) => entry.id === card.dataset.id);
      if (!item) return;
      item.status = event.target.value;
      saveItems();
      render();
      try {
        await updateCloudItem(item);
        cloudReady = true;
        lastCloudError = "";
      } catch (error) {
        cloudReady = false;
        lastCloudError = error.message || "状态云同步失败";
      }
      render();
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        activeFilter = chip.dataset.filter;
        document.querySelectorAll(".chip").forEach((item) => item.classList.remove("active"));
        chip.classList.add("active");
        render();
      });
    });

    notifyButton.addEventListener("click", requestNotificationPermission);

    document.querySelector("#shareButton").addEventListener("click", () => {
      dialogTitle.textContent = "分享清单";
      dialogHelp.textContent = "复制下面的链接发给对方，对方打开后会看到同一份当前清单。";
      copyShare.textContent = "复制";
      shareText.value = exportText();
      shareDialog.showModal();
      shareText.select();
    });

    document.querySelector("#importButton").addEventListener("click", () => {
      dialogTitle.textContent = "导入清单";
      dialogHelp.textContent = "把对方发来的分享链接或完整内容粘在这里，然后点导入。";
      copyShare.textContent = "导入";
      shareText.value = "";
      shareDialog.showModal();
      shareText.focus();
    });

    copyShare.addEventListener("click", async () => {
      if (copyShare.textContent === "导入") {
        const value = shareText.value.trim();
        const hash = value.includes("#list=") ? value.split("#list=")[1] : value;
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(hash.replace(/^list=/, "")))));
          if (!Array.isArray(decoded)) throw new Error("Invalid list");
          items = decoded.map(normalizeItem);
          saveItems();
          render();
          if (cloudReady) {
            await cloudRequest("", {
              method: "POST",
              headers: { Prefer: "resolution=merge-duplicates,return=representation" },
              body: JSON.stringify(items.map(toCloudItem))
            });
            await syncFromCloud();
          }
          shareDialog.close();
          showToast("已导入");
        } catch (error) {
          showToast("导入失败，请检查内容");
        }
        return;
      }

      await navigator.clipboard.writeText(shareText.value);
      showToast("已复制分享链接");
    });

    document.querySelector("#closeDialog").addEventListener("click", () => {
      shareDialog.close();
    });

    render();
    if (importedFromHash) showToast("已导入分享清单");
    syncFromCloud({ seedIfEmpty: true });
    setInterval(() => syncFromCloud(), 5000);
    if ("Notification" in window && Notification.permission === "granted") {
      notifyButton.textContent = "提醒已开启";
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
